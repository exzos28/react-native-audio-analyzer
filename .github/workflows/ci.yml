name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint files
        run: yarn lint

      - name: Typecheck files
        run: yarn typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run unit and integration tests
        run: yarn test -- --maxWorkers=2 --coverage

  test-cpp:
    # Linux: built-in decoders only. macOS: also the AudioToolbox platform decoder.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Build and run C++ tests (ASan + UBSan)
        working-directory: packages/react-native-audio-analyzer
        run: |
          cmake -S cpp/tests -B cpp/tests/build -DCMAKE_BUILD_TYPE=Debug
          cmake --build cpp/tests/build --parallel
          ctest --test-dir cpp/tests/build --output-on-failure

  build-library:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: yarn turbo run build --filter='./packages/*'

      - name: Check package contents
        working-directory: packages/react-native-audio-analyzer
        run: |
          yarn pack --dry-run | tee pack.txt
          for file in libs/miniaudio/miniaudio.h nitrogen/generated/ios/AudioAnalyzer+autolinking.rb lib/module/index.js README.md; do
            grep -q "$file" pack.txt || { echo "::error::$file is missing from the npm package"; exit 1; }
          done

  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      # Fails on broken links and on API changes that break the examples.
      - name: Build docs site
        run: yarn workspace docs build

  build-android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [rn-cli-example, expo-example]
    env:
      TURBO_CACHE_DIR: .turbo/android-${{ matrix.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Setup
        uses: ./.github/actions/setup

      - name: Generate nitrogen code
        run: yarn nitrogen

      - name: Cache turborepo for Android
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-turborepo-android-${{ matrix.app }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-turborepo-android-${{ matrix.app }}-

      - name: Check turborepo cache for Android
        run: |
          TURBO_CACHE_STATUS=$(node -p "($(yarn turbo run build:android --filter=${{ matrix.app }} --cache-dir="${{ env.TURBO_CACHE_DIR }}" --dry=json)).tasks.find(t => t.task === 'build:android').cache.status")

          if [[ $TURBO_CACHE_STATUS == "HIT" ]]; then
            echo "turbo_cache_hit=1" >> $GITHUB_ENV
          fi

      - name: Install JDK
        if: env.turbo_cache_hit != 1
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Finalize Android SDK
        if: env.turbo_cache_hit != 1
        run: |
          /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"

      - name: Cache Gradle
        if: env.turbo_cache_hit != 1
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ matrix.app }}-${{ hashFiles('apps/rn-cli-example/android/gradle/wrapper/gradle-wrapper.properties', 'yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ matrix.app }}-

      - name: Build ${{ matrix.app }} for Android
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx6g'
        run: |
          yarn turbo run build:android --filter=${{ matrix.app }} --cache-dir="${{ env.TURBO_CACHE_DIR }}"

  build-ios:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        app: [rn-cli-example, expo-example]
    env:
      XCODE_VERSION: 26
      TURBO_CACHE_DIR: .turbo/ios-${{ matrix.app }}
      RCT_USE_RN_DEP: 1
      RCT_USE_PREBUILT_RNCORE: 1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Setup
        uses: ./.github/actions/setup

      - name: Generate nitrogen code
        run: yarn nitrogen

      - name: Cache turborepo for iOS
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-turborepo-ios-${{ matrix.app }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-turborepo-ios-${{ matrix.app }}-

      - name: Check turborepo cache for iOS
        run: |
          TURBO_CACHE_STATUS=$(node -p "($(yarn turbo run build:ios --filter=${{ matrix.app }} --cache-dir="${{ env.TURBO_CACHE_DIR }}" --dry=json)).tasks.find(t => t.task === 'build:ios').cache.status")

          if [[ $TURBO_CACHE_STATUS == "HIT" ]]; then
            echo "turbo_cache_hit=1" >> $GITHUB_ENV
          fi

      - name: Use appropriate Xcode version
        if: env.turbo_cache_hit != 1
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install CocoaPods dependencies
        if: env.turbo_cache_hit != 1 && matrix.app == 'rn-cli-example'
        working-directory: apps/rn-cli-example
        run: |
          bundle install
          bundle exec pod install --project-directory=ios

      - name: Build ${{ matrix.app }} for iOS
        if: env.turbo_cache_hit != 1
        run: |
          yarn turbo run build:ios --filter=${{ matrix.app }} --cache-dir="${{ env.TURBO_CACHE_DIR }}"
