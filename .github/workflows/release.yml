name: Release
on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    # Never publish from forks.
    if: github.repository == 'exzos28/react-native-audio-analyzer'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # miniaudio.h is shipped inside the npm package.
          submodules: true

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build packages
        run: yarn turbo run build --filter='./packages/*'

      # On every push to main this either opens/updates the "Version Packages"
      # PR (when there are pending changesets) or, once that PR is merged,
      # publishes the new version to npm and creates a GitHub release.
      - name: Create release pull request or publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: yarn changeset version
          publish-script: yarn changeset publish
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
          create-github-releases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
